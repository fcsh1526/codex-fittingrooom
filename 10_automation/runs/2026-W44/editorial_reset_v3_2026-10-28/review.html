<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><title>Mira W44 v3 整片改案</title><style>body{background:#f3efe6;color:#293944;font:18px "Microsoft JhengHei",sans-serif;max-width:1100px;margin:40px auto;padding:20px}p{line-height:1.8}img{max-width:100%;height:auto}a{color:#22677c}.note{background:#fff;padding:20px;border-radius:12px}</style><h1>走過街角，換一種出門狀態</h1><p>W44整片改案v3 · M02一人兩套 · 待審，未生成照片或影片</p><div class="note"><p>紫色外搭＋俐落褲裝 → 白短袖內搭深藍細肩帶洋裝。人物沿路走，鏡頭從斜前方經側前方、前景柱，再逐步接近；先看完整16秒。</p><p>下方為同場地／時鐘的雙路徑與相機投影，簡化人形不代表身份或實際步態。0.75秒仍是柔接基準，實片舒服度尚未驗證。</p></div><p><img src="shared_route_previs_16s.gif" alt="16秒同步雙路徑與相機視角示意預演"></p><h2>連貫分鏡</h2><img src="connected_storyboard_v3.png" alt="八個關鍵視角"><p><a href="REVIEW.md">完整提案、兩套服裝、時序與執行缺口</a></p><p>目前需要8.25與8.5秒原速來源；工具時長／控制尚未核對，若僅6秒，不能直接執行。既有照片只作身份／服裝參考。改案確認前不生成新圖。</p></html>
