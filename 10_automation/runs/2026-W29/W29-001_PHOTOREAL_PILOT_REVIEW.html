<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>W29-001 Photoreal Pilot Review</title>
  <style>
    :root { color-scheme: light; font-family: Arial, "Microsoft JhengHei", sans-serif; }

    p { margin: 0; color: #555; line-height: 1.5; }

    figure { margin: 0; background: #fff; border: 1px solid #d7d7d2; border-radius: 6px; overflow: hidden; }
    img { display: block; width: 100%; aspect-ratio: 4 / 7; object-fit: cover; object-position: top center; background: #e7e7e2; }
    figcaption { padding: 14px 16px 16px; }
    strong { display: block; margin-bottom: 5px; font-size: 15px; }
    span { color: #666; font-size: 13px; line-height: 1.45; }
    footer { padding: 0 20px 24px; color: #555; font-size: 13px; }
    @media (max-width: 800px) { main { grid-template-columns: 1fr; } img { aspect-ratio: 4 / 5; object-fit: contain; } }
  </style>
</head>
