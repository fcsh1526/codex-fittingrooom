<!doctype html><meta charset="utf-8"><title>Mira M01 whole film review</title>
<style>body{margin:0;background:#222;color:#eee;font:16px system-ui}main{display:flex;gap:25px;padding:12px}video{height:92vh;max-width:65vw}button{font-size:16px;padding:10px;display:block;margin:8px 0}</style>
<main><video id="v" controls muted preload="auto" src="M01_W46_eight_beats_v1.mp4"></video><aside><p>Mira M01 whole film review</p><button onclick="v.currentTime=0;v.playbackRate=1;v.play()">Play entire film at 1x</button><button onclick="v.currentTime=8.7;v.playbackRate=1;v.play()">Review comparison join</button><button onclick="v.pause()">Pause</button><p id="status">Loading</p></aside></main>
<script>const v=document.getElementById('v');let plays=0;v.onplay=()=>plays++;v.ontimeupdate=()=>document.getElementById('status').textContent=v.currentTime.toFixed(2)+' / '+v.duration.toFixed(2)+' s at '+v.playbackRate+'x';v.onended=()=>document.getElementById('status').textContent='Ended '+v.currentTime.toFixed(2)+' s at '+v.playbackRate+'x';</script>
